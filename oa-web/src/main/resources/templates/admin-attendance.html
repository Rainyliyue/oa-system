<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤管理</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-admin-page="attendance">
<div class="layui-layout">
  <header th:replace="~{layout :: header('考勤管理')}"></header>
  <aside th:replace="~{layout :: side}"></aside>
  <main class="layui-body">
    <section class="layui-card"><div class="layui-card-body"><div class="toolbar"><input id="keyword" class="layui-input" data-query="keyword" placeholder="姓名/备注"><input class="layui-input" data-query="userId" data-query-number placeholder="用户ID"><select class="layui-select" data-query="status"><option value="">全部状态</option><option value="NORMAL">正常</option><option value="ABNORMAL">异常</option></select><input class="layui-input" type="text" data-query="startDate" data-date-input inputmode="numeric" maxlength="10" placeholder="考勤日期"><button id="searchBtn" class="layui-btn">查询</button><button id="resetQueryBtn" class="layui-btn layui-btn-primary" type="button">重置</button></div></div></section>
    <section class="layui-card"><div class="layui-card-header">考勤列表</div><div class="layui-card-body"><div class="table-wrap"><table id="crudTable" class="layui-table"></table></div></div></section>
    <section class="layui-card"><div class="layui-card-header">修改考勤</div><div class="layui-card-body">
      <form id="crudForm" class="layui-form">
        <input type="hidden" name="id">
        <div class="layui-form-item"><label class="layui-form-label">日期</label><input class="layui-input" type="text" name="workDate" data-date-input inputmode="numeric" maxlength="10" placeholder="yyyy-MM-dd"></div>
        <div class="layui-form-item"><label class="layui-form-label">上班时间</label><input class="layui-input" type="text" name="clockInTime" data-datetime-input inputmode="numeric" maxlength="16" placeholder="yyyy-MM-dd HH:mm"></div>
        <div class="layui-form-item"><label class="layui-form-label">下班时间</label><input class="layui-input" type="text" name="clockOutTime" data-datetime-input inputmode="numeric" maxlength="16" placeholder="yyyy-MM-dd HH:mm"></div>
        <div class="layui-form-item"><label class="layui-form-label">状态</label><select class="layui-select" name="status"><option value="NORMAL">正常</option><option value="ABNORMAL">异常</option></select></div>
        <div class="layui-form-item wide"><label class="layui-form-label">备注</label><textarea class="layui-textarea" name="remark"></textarea></div>
        <div class="layui-form-item wide"><button class="layui-btn" type="submit">保存修改</button><button id="resetBtn" class="layui-btn layui-btn-primary" type="button">清空</button></div>
      </form>
    </div></section>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin-simple.js"></script>
</body>
</html>
