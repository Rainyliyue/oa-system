<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OA 办公系统注册</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<main class="auth-box layui-card">
  <div class="auth-brand">
    <div class="auth-mark">OA</div>
    <div>
      <h1>创建账号</h1>
      <p>注册普通用户</p>
    </div>
  </div>
  <div class="layui-card-header">基础信息</div>
  <div class="layui-card-body">
    <form id="registerForm" class="layui-form">
      <div class="layui-form-item wide"><label class="layui-form-label">用户名</label><input class="layui-input" name="username" placeholder="请输入用户名" required></div>
      <div class="layui-form-item wide"><label class="layui-form-label">密码</label><input class="layui-input" type="password" name="password" placeholder="请输入密码" required></div>
      <div class="layui-form-item wide"><label class="layui-form-label">姓名</label><input class="layui-input" name="realName" placeholder="请输入姓名"></div>
      <div class="layui-form-item wide"><label class="layui-form-label">手机</label><input class="layui-input" name="phone" placeholder="请输入手机号"></div>
      <div class="layui-form-item wide"><label class="layui-form-label">部门</label><input class="layui-input" name="department" placeholder="请输入部门"></div>
      <div class="layui-form-item wide auth-actions">
        <button class="layui-btn" type="submit">注册</button>
        <a class="layui-btn layui-btn-primary" href="/login">返回登录</a>
      </div>
    </form>
  </div>
</main>
<script src="/js/common.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const result = await postJson("/doRegister", formData(event.target));
  toast(result.msg);
  if (result.code === 0) {
    setTimeout(() => location.href = "/login", 600);
  }
});
</script>
</body>
</html>
