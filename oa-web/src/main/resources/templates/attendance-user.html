<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤打卡</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="layui-header"><div class="layui-logo">考勤打卡</div><a href="/index">返回工作台</a></header>
<main class="layui-body" style="margin-left:0">
  <section class="layui-card">
    <div class="layui-card-header">今日考勤</div>
    <div class="layui-card-body">
      <p id="todayInfo" class="muted">加载中...</p>
      <div class="toolbar">
        <button id="clockInBtn" class="layui-btn layui-btn-normal">上班打卡</button>
        <button id="clockOutBtn" class="layui-btn">下班打卡</button>
      </div>
    </div>
  </section>
</main>
<script src="/js/common.js"></script>
<script src="/js/attendance-user.js"></script>
</body>
</html>
