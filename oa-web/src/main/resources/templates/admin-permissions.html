<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限资源</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-admin-page="permissions">
<div class="layui-layout">
  <header th:replace="~{layout :: header('权限资源')}"></header>
  <aside th:replace="~{layout :: side}"></aside>
  <main class="layui-body">
    <section class="layui-card"><div class="layui-card-body"><div class="toolbar"><input id="keyword" class="layui-input" placeholder="权限编码/名称/路径"><button id="searchBtn" class="layui-btn">查询</button></div></div></section>
    <section class="layui-card"><div class="layui-card-header">权限表单</div><div class="layui-card-body">
      <form id="crudForm" class="layui-form">
        <input type="hidden" name="id">
        <div class="layui-form-item"><label class="layui-form-label">权限编码</label><input class="layui-input" name="permissionCode" placeholder="如 USER_MANAGE"></div>
        <div class="layui-form-item"><label class="layui-form-label">权限名称</label><input class="layui-input" name="permissionName"></div>
        <div class="layui-form-item"><label class="layui-form-label">路径</label><input class="layui-input" name="path" placeholder="/admin/users"></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label><select class="layui-select" name="type"><option value="MENU">菜单</option><option value="BUTTON">按钮</option></select></div>
        <div class="layui-form-item wide"><button class="layui-btn" type="submit">保存</button><button id="resetBtn" class="layui-btn layui-btn-primary" type="button">清空</button></div>
      </form>
    </div></section>
    <section class="layui-card"><div class="layui-card-header">权限列表</div><div class="layui-card-body"><div class="table-wrap"><table id="crudTable" class="layui-table"></table></div></div></section>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin-simple.js"></script>
</body>
</html>
