<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="layui-layout">
  <header th:replace="~{layout :: header('操作日志')}"></header>
  <aside th:replace="~{layout :: side}"></aside>
  <main class="layui-body">
    <section class="layui-card">
      <div class="layui-card-body">
        <div class="toolbar">
          <input id="keyword" class="layui-input" data-query="keyword" placeholder="操作人/模块/内容">
          <select class="layui-select" data-query="type">
            <option value="">全部操作</option>
            <option value="CREATE">新增</option>
            <option value="UPDATE">修改</option>
            <option value="DELETE">删除</option>
            <option value="APPROVE">审批</option>
            <option value="ASSIGN_PERMISSION">分配权限</option>
          </select>
          <button id="searchBtn" class="layui-btn">查询</button>
          <button id="resetQueryBtn" class="layui-btn layui-btn-primary" type="button">重置</button>
        </div>
      </div>
    </section>
    <section class="layui-card">
      <div class="layui-card-header">日志列表</div>
      <div class="layui-card-body">
        <div class="table-wrap"><table id="logTable" class="layui-table"></table></div>
      </div>
    </section>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin-logs.js"></script>
</body>
</html>
