<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OA 办公系统</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="layui-layout">
  <header th:replace="~{layout :: header('工作台')}"></header>
  <aside th:replace="~{layout :: side}"></aside>
  <main class="layui-body">
    <section class="welcome-panel">
      <div>
        <span class="eyebrow">WORKSPACE</span>
        <h1>欢迎使用 OA 办公系统</h1>
        <p class="muted">请假、出差、报销、考勤与工资信息统一管理。</p>
      </div>
      <div class="welcome-user">
        <span>当前用户</span>
        <strong th:text="${user != null ? user.realName : '用户'}">用户</strong>
      </div>
    </section>
    <div class="home-grid">
      <section class="stat"><span class="stat-icon">A</span><strong>申请流程</strong><span class="muted">请假、出差、报销均支持提交、修改、删除与审批。</span></section>
      <section class="stat"><span class="stat-icon">T</span><strong>考勤打卡</strong><span class="muted">普通用户每天完成上班和下班打卡。</span></section>
      <section class="stat"><span class="stat-icon">R</span><strong>权限分离</strong><span class="muted">管理员菜单仅 ADMIN 角色可见并由 Gateway 拦截。</span></section>
      <section class="stat"><span class="stat-icon">S</span><strong>课程技术栈</strong><span class="muted">Spring Boot 3.0.2 + Nacos 2.2.2 + OpenFeign + Redis + MySQL。</span></section>
    </div>
  </main>
</div>
</body>
</html>
