<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OA 办公系统</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css?v=home-shortcut-20260616">
</head>
<body class="workbench-page">
<div class="layui-layout">
  <header th:replace="~{layout :: header('工作台')}"></header>
  <aside th:replace="~{layout :: side}"></aside>
  <main class="layui-body">
    <section class="welcome-panel">
      <div>
        <span class="eyebrow">WORKSPACE</span>
        <h1>欢迎使用 OA 办公系统</h1>
        <p class="muted">请假、出差、报销、考勤与工资信息统一管理。</p>
      </div>
      <div class="welcome-user">
        <span>当前用户</span>
        <strong th:text="${user != null ? user.realName : '用户'}">用户</strong>
      </div>
    </section>

    <section class="home-grid dashboard-stats">
      <div class="stat">
        <span class="stat-icon">审</span>
        <strong id="pendingApprovalCount">0</strong>
        <span class="muted">待审批</span>
      </div>
      <div class="stat">
        <span class="stat-icon">勤</span>
        <strong id="monthlyAttendanceCount">0</strong>
        <span class="muted">本月考勤</span>
      </div>
      <div class="stat">
        <span class="stat-icon">申</span>
        <strong id="monthlyApplicationCount">0</strong>
        <span class="muted">本月申请</span>
      </div>
      <div class="stat">
        <span class="stat-icon">信</span>
        <strong id="unreadNoticeCount">0</strong>
        <span class="muted">未读通知</span>
      </div>
    </section>

    <section class="clock-card">
      <div class="clock-card-content">
        <span class="eyebrow">TODAY ATTENDANCE</span>
        <h2>今日考勤</h2>
        <p id="homeTodayInfo" class="muted">加载中...</p>
        <div class="clock-actions">
          <button id="homeClockInBtn" class="layui-btn layui-btn-normal" type="button">上班打卡</button>
          <button id="homeClockOutBtn" class="layui-btn" type="button">下班打卡</button>
          <a class="layui-btn layui-btn-primary" href="/user/attendance">查看考勤</a>
        </div>
      </div>
    </section>

    <section class="notice-panel">
      <div class="section-title">
        <div>
          <span class="eyebrow">MESSAGE CENTER</span>
          <h2>消息提醒</h2>
        </div>
        <button id="markAllNoticeBtn" class="layui-btn layui-btn-primary" type="button">全部已读</button>
      </div>
      <div id="noticeList" class="notice-list muted">加载中...</div>
    </section>

    <section class="shortcut-panel">
      <div class="section-title">
        <div>
          <span class="eyebrow">QUICK ACCESS</span>
          <h2>快捷入口</h2>
        </div>
        <span class="muted">常用个人办公功能</span>
      </div>
      <div class="shortcut-grid">
        <a class="shortcut-entry entry-leave" href="/user/apply/leave">
          <span class="shortcut-icon">假</span>
          <strong>请假申请</strong>
          <span>提交或查看请假记录</span>
        </a>
        <a class="shortcut-entry entry-trip" href="/user/apply/trip">
          <span class="shortcut-icon">差</span>
          <strong>出差申请</strong>
          <span>提交或查看出差记录</span>
        </a>
        <a class="shortcut-entry entry-attendance" href="/user/attendance">
          <span class="shortcut-icon">勤</span>
          <strong>考勤打卡</strong>
          <span>进入考勤打卡页面</span>
        </a>
      </div>
    </section>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
