<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-admin-page="users">
<div class="layui-layout">
  <header th:replace="~{layout :: header('用户管理')}"></header>
  <aside th:replace="~{layout :: side}"></aside>
  <main class="layui-body">
    <section class="layui-card"><div class="layui-card-body"><div class="toolbar"><input id="keyword" class="layui-input" data-query="keyword" placeholder="用户名/姓名/部门/手机"><select class="layui-select" data-query="enabled" data-query-boolean><option value="">全部状态</option><option value="true">启用</option><option value="false">禁用</option></select><button id="searchBtn" class="layui-btn">查询</button><button id="resetQueryBtn" class="layui-btn layui-btn-primary" type="button">重置</button></div></div></section>
    <section class="layui-card"><div class="layui-card-header">用户列表</div><div class="layui-card-body"><div class="table-wrap"><table id="crudTable" class="layui-table"></table></div></div></section>
    <section class="layui-card">
      <div class="layui-card-header">用户表单</div>
      <div class="layui-card-body">
        <form id="crudForm" class="layui-form">
          <input type="hidden" name="id">
          <div class="layui-form-item"><label class="layui-form-label">用户名</label><input class="layui-input" name="username"></div>
          <div class="layui-form-item"><label class="layui-form-label">密码</label><input class="layui-input" name="password" placeholder="修改时可留空"></div>
          <div class="layui-form-item"><label class="layui-form-label">姓名</label><input class="layui-input" name="realName"></div>
          <div class="layui-form-item"><label class="layui-form-label">手机</label><input class="layui-input" name="phone"></div>
          <div class="layui-form-item"><label class="layui-form-label">部门</label><input class="layui-input" name="department"></div>
          <div class="layui-form-item"><label class="layui-form-label">角色ID</label><input class="layui-input" name="roleIds" placeholder="如 1,2"></div>
          <div class="layui-form-item"><label class="layui-form-label">启用</label><select class="layui-select" name="enabled"><option value="true">是</option><option value="false">否</option></select></div>
          <div class="layui-form-item"><button class="layui-btn" type="submit">保存</button><button id="resetBtn" class="layui-btn layui-btn-primary" type="button">清空</button></div>
        </form>
      </div>
    </section>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin-users.js"></script>
</body>
</html>
