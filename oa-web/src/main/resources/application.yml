server:
  port: 8001

spring:
  application:
    name: oa-web
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_WEB_PORT:8721}
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            readTimeout: ${FEIGN_READ_TIMEOUT:5000}
            loggerLevel: ${FEIGN_LOGGER_LEVEL:basic}
      httpclient:
        enabled: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
  level:
    com.oa.web.feign: DEBUG

oa:
  jwt:
    secret: oa-system-course-design-secret-key-change-me
    expiration-seconds: 7200
  upload:
    image-dir: ${OA_UPLOAD_IMAGE_DIR:uploads/images}

feign:
  sentinel:
    enabled: true

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: oa_tx_group
  service:
    vgroup-mapping:
      oa_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
