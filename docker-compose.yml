services:
  mysql-service:
    image: mysql:8.0
    container_name: oa-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oa_system}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-oa-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oa-network

  redis-service:
    image: redis:7.4.5
    container_name: oa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-7379}:6379"
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oa-network

  nacos-service:
    image: nacos/nacos-server:v2.2.2
    container_name: oa-nacos
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_RAFT_PORT:-9849}:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - oa-network

  nginx-service:
    image: nginx:1.27-alpine
    container_name: oa-nginx
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oa-network

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: oa-sentinel
    restart: unless-stopped
    profiles:
      - sentinel
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "${SENTINEL_DASHBOARD_PORT:-8858}:8858"
    networks:
      - oa-network

  seata-service:
    image: seataio/seata-server:1.7.0
    container_name: oa-seata
    restart: unless-stopped
    profiles:
      - tx
    environment:
      TZ: Asia/Shanghai
      STORE_MODE: file
      SEATA_IP: 127.0.0.1
      SEATA_PORT: 8091
    ports:
      - "${SEATA_PORT:-8091}:8091"
      - "${SEATA_CONSOLE_PORT:-7091}:7091"
    networks:
      - oa-network

networks:
  oa-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
